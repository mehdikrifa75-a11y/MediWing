<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1960" viewBox="0 0 2600 1960"><rect width="2600" height="1960" fill="white"/><rect x="14" y="14" width="2572" height="1932" fill="none" stroke="#000" stroke-width="3"/><text x="48" y="80" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#000" text-anchor="start">Pièce 4 – Pied d'atterrissage (× 4, PETG)</text><text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#444" text-anchor="start">MediWing · version du 25/11/2026 · vissé sous chaque moteur par ses 4 vis M2 × 8</text><text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">VUE DE DESSUS (côté bras)</text><circle cx="520" cy="640" r="180" fill="#e8eef8" stroke="#000" stroke-width="3"/><circle cx="520" cy="640" r="60" fill="white" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/><circle cx="520" cy="640" r="30" fill="white" stroke="#000" stroke-width="2"/><circle cx="587.5" cy="707.5" r="19.5" fill="white" stroke="#000" stroke-width="2"/><circle cx="587.5" cy="572.5" r="19.5" fill="white" stroke="#000" stroke-width="2"/><circle cx="452.5" cy="707.5" r="19.5" fill="white" stroke="#000" stroke-width="2"/><circle cx="452.5" cy="572.5" r="19.5" fill="white" stroke="#000" stroke-width="2"/><line x1="452.5" y1="390" x2="587.5" y2="390" stroke="#0a66c2" stroke-width="2"/><path d="M452.5 390 l12 -6 v12z M587.5 390 l-12 -6 v12z" fill="#0a66c2"/><line x1="452.5" y1="572.5" x2="452.5" y2="398" stroke="#0a66c2" stroke-width="1.5"/><line x1="587.5" y1="572.5" x2="587.5" y2="398" stroke="#0a66c2" stroke-width="1.5"/><text x="520.0" y="378" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle">9</text><line x1="340" y1="890" x2="700" y2="890" stroke="#0a66c2" stroke-width="2"/><path d="M340 890 l12 -6 v12z M700 890 l-12 -6 v12z" fill="#0a66c2"/><