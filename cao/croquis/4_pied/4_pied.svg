roke-width="2"/><path d="M1790 400 l-6 12 h12z M1790 940 l-6 -12 h12z" fill="#0a66c2"/><line x1="1720" y1="400" x2="1798" y2="400" stroke="#0a66c2" stroke-width="1.5"/><line x1="1720" y1="940" x2="1798" y2="940" stroke="#0a66c2" stroke-width="1.5"/><text x="1830" y="670.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1830 670.0)">36</text><line x1="1300" y1="400" x2="1300" y2="430" stroke="#0a66c2" stroke-width="2"/><path d="M1300 400 l-6 12 h12z M1300 430 l-6 -12 h12z" fill="#0a66c2"/><line x1="1360" y1="400" x2="1308" y2="400" stroke="#0a66c2" stroke-width="1.5"/><line x1="1360" y1="430" x2="1308" y2="430" stroke="#0a66c2" stroke-width="1.5"/><text x="1340" y="415.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1340 415.0)">2</text><line x1="1480" y1="550" x2="1600" y2="550" stroke="#0a66c2" stroke-width="2"/><path d="M1480 550 l12 -6 v12z M1600 550 l-12 -6 v12z" fill="#0a66c2"/><text x="1540.0" y="538" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle">Ø 8</text><line x1="1420" y1="1010" x2="1660" y2="1010" stroke="#0a66c2" stroke-width="2"/><path d="M1420 1010 l12 -6 v12z M1660 1010 l-12 -6 v12z" fill="#0a66c2"/><line x1="1420" y1="940" x2="1420" y2="1018" stroke="#0a66c2" stroke-width="1.5"/><line x1="1660" y1="940" x2="1660" y2="1018" stroke="#0a66c2" stroke-width="1.5"/><text x="1540.0" y="998" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle">Ø 16</text><line x1="1660" y1="850" x2="1800" y2="850" stroke="#0a66c2" stroke-width="1.5"/><line x1="1780" y1="850" x2="1780" y2="940" stroke="#0a66c2" stroke-width="2"/><path d="M1780 850 l-6 12 h12z M1780 940 l-6 -12 h12z" fill="#0a66c2"/><text x="1820" y="895.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1820 895.0)">6</text><text x="1390" y="895" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="end">cône à 45°</text><text x="1390" y="923" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="end">trous Ø 4,5 pour la clé</text><text x="1150" y="1300" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">Principe :</text><text x="1150" y="1342" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• la collerette se plaque sous le bras ; les 4 vis M2 × 8 traversent la collerette</text><text x="1150" y="1384" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">  et le bras jusqu'au moteur (vis d'origine de 6 mm + 2 mm de collerette) ;</text><text x="1150" y="1426" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• 36 mm de haut : le dessous de la boîte du colis reste à environ 5 mm du sol ;</text><text x="1150" y="1468" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• tube Ø 8 : les têtes de vis passent à côté ; 4 trous Ø 4,5 dans le patin pour la clé ;</text><text x="1150" y="1510" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• patin conique à 45°, collerette sur le plateau.</text><text x="200" y="1820" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Cotes en mm. Trous à 9 × 9 mesurés sur le moteur F2004 en séance 4.</text><text x="200" y="1858" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Impression PETG, couche 0,2 mm, 4 périmètres, remplissage 20 %, supports partout, bordure.</text></svg>