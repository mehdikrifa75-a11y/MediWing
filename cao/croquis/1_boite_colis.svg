l" fill="#333" text-anchor="start">parois et fond 2 · hauteur 23</text><text x="290.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#333" text-anchor="start">Doliprane couché ici</text><line x1="150" y1="820.0" x2="150" y2="888.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="990.0" y1="820.0" x2="990.0" y2="888.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="150" y1="880.0" x2="990.0" y2="880.0" stroke="#0a66c2" stroke-width="2"/><polygon points="150,880.0 162,874.0 162,886.0" fill="#0a66c2" stroke="none"/><polygon points="990.0,880.0 978.0,874.0 978.0,886.0" fill="#0a66c2" stroke="none"/><text x="570.0" y="870.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">120</text><line x1="990.0" y1="260" x2="1058.0" y2="260" stroke="#0a66c2" stroke-width="1.5"/><line x1="990.0" y1="820.0" x2="1058.0" y2="820.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1050.0" y1="260" x2="1050.0" y2="820.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1050.0,260 1044.0,272 1056.0,272" fill="#0a66c2" stroke="none"/><polygon points="1050.0,820.0 1044.0,808.0 1056.0,808.0" fill="#0a66c2" stroke="none"/><text x="1038.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1038.0 540.0)">80</text><line x1="479.0" y1="610.0" x2="479.0" y2="572.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="717.0" y1="610.0" x2="717.0" y2="572.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="479.0" y1="580.0" x2="717.0" y2="580.0" stroke="#0a66c2" stroke-width="2"/><polygon points="479.0,580.0 491.0,574.0 491.0,586.0" fill="#0a66c2" stroke="none"/><polygon points="717.0,580.0 705.0,574.0 705.0,586.0" fill="#0a66c2" stroke="none"/><text x="598.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">34</text><line x1="465.0" y1="624.0" x2="427.0" y2="624.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="465.0" y1="820.0" x2="427.0" y2="820.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="435.0" y1="624.0" x2="435.0" y2="820.0" stroke="#0a66c2" stroke-width="2"/><polygon points="435.0,624.0 429.0,636.0 441.0,636.0" fill="#0a66c2" stroke="none"/><polygon points="435.0,820.0 429.0,808.0 441.0,808.0" fill="#0a66c2" stroke="none"/><text x="423.0" y="722.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 423.0 722.0)">28</text><line x1="703.0" y1="617.0" x2="850.0" y2="526.0" stroke="#b35900" stroke-width="1.5"/><text x="856.0" y="522.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#b35900" text-anchor="start">fente 5 × 2,5</text><text x="150" y="1110" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">CORPS – coupe par l'encoche (vue de côté, avant à gauche)</text><rect x="150" y="1150" width="560.0" height="161.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="164.0" y="1150" width="350.0" height="147.0" rx="0" fill="white" stroke="#000" stroke-width="2"/><rect x="514.0" y="1150" width="196.0" height="63.0" rx="0" fill="#fdf0d8" stroke="#000" stroke-width="2"/><rect x="500.0" y="1150" width="14.0" height="17.5" rx="0" fill="#ff9f1c" stroke="#000" stroke-width="1.5"/><text x="612.0" y="1192.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="middle">encoche</text><line x1="150" y1="1311.0" x2="150" y2="1379.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="710.0" y1="1311.0" x2="710.0" y2="1379.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="150" y1="1371.0" x2="710.0" y2="1371.0" stroke="#0a66c2" stroke-width="2"/><polygon points="150,1371.0 162,1365.0 162,1377.0" fill="#0a66c2" stroke="none"/><polygon points="710.0,1371.0 698.0,1365.0 698.0,1377.0" fill="#0a66c2" stroke="none"/><text x="430.0" y="1361.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">80</text><line x1="710.0" y1="1150" x2="778.0" y2="1150" stroke="#0a66c2" stroke-width="1.5"/><line x1="710.0" y1="1311.0" x2="778.0" y2="1311.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="770.0" y1="1150" x2="770.0" y2="1311.0" stroke="#0a66c2" stroke-width="2"/><polygon points="770.0,1150 764.0,1162 776.0,1162" fill="#0a66c2" stroke="none"/><polygon points="770.0,1311.0 764.0,1299.0 776.0,1299.0" fill="#0a66c2" stroke="none"/><text x="758.0" y="1230.5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 758.0 1230.5)">23</text><line x1="710.0" y1="1213.0" x2="868.0" y2="1213.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="710.0" y1="1311.0" x2="868.0" y2="1311.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="860.0" y1="1213.0" x2="860.0" y2="1311.0" stroke="#0a66c2" stroke-width="2"/><polygon points="860.0,1213.0 854.0,1225.0 866.0,1225.0" fill="#0a66c2" stroke="none"/><polygon points="860.0,1311.0 854.0,1299.0 866.0,1299.0" fill="#0a66c2" stroke="none"/><text x="848.0" y="1262.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 848.0 1262.0)">14</text><text x="880.0" y="1290.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="start">fond de l'encoche à 14 du dessous</text><text x="1400" y="220" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">COUVERCLE – vue de dessus</text><rect x="1400" y="260" width="840.0" height="560.0" rx="8" fill="#dde6f3" stroke="#000" stroke-width="3"/><rect x="1415.4" y="275.4" width="809.1999999999999" height="529.1999999999999" rx="0" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="10 7"/><rect x="1713.6" y="608.5999999999999" width="268.8" height="211.4" rx="0" fill="white" stroke="#000" stroke-width="2.5"/><text x="1848.0" y="736.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="middle">découpe</text><line x1="1400" y1="820.0" x2="1400" y2="888.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="2240.0" y1="820.0" x2="2240.0" y2="888.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1400" y1="880.0" x2="2240.0" y2="880.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1400,880.0 1412,874.0 1412,886.0" fill="#0a66c2" stroke="none"/><polygon points="2240.0,880.0 2228.0,874.0 2228.0,886.0" fill="#0a66c2" stroke="none"/><text x="1820.0" y="870.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">120</text><line x1="2240.0" y1="260" x2="2308.0" y2="260" stroke="#0a66c2" stroke-width="1.5"/><line x1="2240.0" y1="820.0" x2="2308.0" y2="820.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="2300.0" y1="260" x2="2300.0" y2="820.0" stroke="#0a66c2" stroke-width="2"/><polygon points="2300.0,260 2294.0,272 2306.0,272" fill="#0a66c2" stroke="none"/><polygon points="2300.0,820.0 2294.0,808.0 2306.0,808.0" fill="#0a66c2" stroke="none"/><text x="2288.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 2288.0 540.0)">80</text><line x1="1713.6" y1="608.5999999999999" x2="1713.6" y2="570.5999999999999" stroke="#0a66c2" stroke-width="1.5"/><line x1="1982.4" y1="608.5999999999999" x2="1982.4" y2="570.5999999999999" stroke="#0a66c2" stroke-width="1.5"/><line x1="1713.6" y1="578.5999999999999" x2="1982.4" y2="578.5999999999999" stroke="#0a66c2" stroke-width="2"/><polygon points="1713.6,578.5999999999999 1725.6,572.5999999999999 1725.6,584.5999999999999" fill="#0a66c2" stroke="none"/><polygon points="1982.4,578.5999999999999 1970.4,572.5999999999999 1970.4,584.5999999999999" fill="#0a66c2" stroke="none"/><text x="1848.0" y="568.5999999999999" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">38,4</text><text x="1400" y="970.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Plaque 2 mm + lèvre emboîtée 4 mm (pointillés),</text><text x="1400" y="1012.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">lèvre 115,6 × 75,6, ép. 1,5 (jeu 0,2).</text><text x="1400" y="1054.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Découpe au-dessus de l'encoche : le servo reste accessible.</text><text x="1400" y="1096.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Imprimer à l'envers (plaque sur le plateau).</text><text x="1400" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Principe du largage :</text><text x="1400" y="1192" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">• la boîte est collée sous la plaque inférieure du châssis, tournée</text><text x="1400" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">  (120 mm dans la largeur du drone) ;</text><text x="1400" y="1276" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">• le servo MG90S est couché sous la plaque, dans l'encoche ;</text><text x="1400" y="1318" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">• son palonnier passe dans la fente de 5 mm et retient le colis ;</text><text x="1400" y="1360" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">• à 90°, le palonnier libère le colis.</text><text x="1400" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Hauteur totale de la boîte : 23 + 2 = 25 mm.</text><text x="1400" y="1444" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="start">Masse estimée : corps ≈ 40 g, couvercle ≈ 25 g (PLA).</text><text x="150" y="1780" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Cotes en mm, PROVISOIRES : à vérifier au pied à coulisse sur le châssis avant impression.</text><text x="150" y="1818" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Impression PLA, couche 0,2 mm, remplissage 20 % (pieds en TPU). Jeu d'ajustement : 0,2 mm par côté.</text></svg>