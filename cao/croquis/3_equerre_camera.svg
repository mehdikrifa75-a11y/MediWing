sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start"></text><text x="1450" y="666" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">À mesurer :</text><text x="1450" y="708" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• entraxe des trous du VL53L1X (9 mm supposé) ;</text><text x="1450" y="750" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• hauteur du trou latéral sur les flasques (5,5 mm supposé).</text><text x="200" y="1780" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Cotes en mm, PROVISOIRES : à vérifier au pied à coulisse sur le châssis avant impression.</text><text x="200" y="1818" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Impression PLA, couche 0,2 mm, remplissage 20 % (pieds en TPU). Jeu d'ajustement : 0,2 mm par côté.</text></svg>