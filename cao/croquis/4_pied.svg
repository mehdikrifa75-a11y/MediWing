<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1960" viewBox="0 0 2600 1960"><rect width="2600" height="1960" fill="white"/><rect x="14" y="14" width="2572" height="1932" fill="none" stroke="#000" stroke-width="3"/><text x="48" y="80" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#000" text-anchor="start">Pièce 4 – Pied d'atterrissage (× 4, TPU)</text><text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="normal" fill="#444" text-anchor="start">MediWing · version finale du 06/11/2026 · fixé sous chaque moteur par ses 4 vis M2 × 10 · le drone sans colis se pose dessus</text><text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">VUE DE DESSUS</text><circle cx="520" cy="640" r="240.0" fill="#e8eef8" stroke="#000" stroke-width="3"/><circle cx="520" cy="640" r="100.0" fill="white" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/><circle cx="520" cy="640" r="60.0" fill="white" stroke="#000" stroke-width="2"/><circle cx="400.0" cy="640.0" r="22.0" fill="white" stroke="#000" stroke-width="2"/><circle cx="640.0" cy="640.0" r="22.0" fill="white" stroke="#000" stroke-width="2"/><circle cx="520.0" cy="520.0" r="22.0" fill="white" stroke="#000" stroke-width="2"/><circle cx="520.0" cy="760.0" r="22.0" fill="white" stroke="#000" stroke-width="2"/><line x1="280.0" y1="640" x2="280.0" y2="958.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="760.0" y1="640" x2="760.0" y2="958.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="280.0" y1="950.0" x2="760.0" y2="950.0" stroke="#0a66c2" stroke-width="2"/><polygon points="280.0,950.0 292.0,944.0 292.0,956.0" fill="#0a66c2" stroke="none"/><polygon points="760.0,950.0 748.0,944.0 748.0,956.0" fill="#0a66c2" stroke="none"/><text x="520.0" y="940.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">Ø 24</text><line x1="400.0" y1="640" x2="400.0" y2="342.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="640.0" y1="640" x2="640.0" y2="342.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="400.0" y1="350.0" x2="640.0" y2="350.0" stroke="#0a66c2" stroke-width="2"/><polygon points="400.0,350.0 412.0,344.0 412.0,356.0" fill="#0a66c2" stroke="none"/><polygon points="640.0,350.0 628.0,344.0 628.0,356.0" fill="#0a66c2" stroke="none"/><text x="520.0" y="340.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">12</text><text x="520" y="1030.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="middle">4 trous Ø 2,2 à 12 × 12 (vis du moteur F2004)</text><text x="1150" y="270" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">VUE DE CÔTÉ</text><rect x="1300" y="400" width="480.0" height="40.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="1440.0" y="440.0" width="200.0" height="260.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="1480.0" y="440.0" width="120.0" height="260.0" rx="0" fill="white" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/><rect x="1380.0" y="700.0" width="320.0" height="40.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><line x1="1780.0" y1="400" x2="1868.0" y2="400" stroke="#0a66c2" stroke-width="1.5"/><line x1="1780.0" y1="740.0" x2="1868.0" y2="740.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1860.0" y1="400" x2="1860.0" y2="740.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1860.0,400 1854.0,412 1866.0,412" fill="#0a66c2" stroke="none"/><polygon points="1860.0,740.0 1854.0,728.0 1866.0,728.0" fill="#0a66c2" stroke="none"/><text x="1848.0" y="570.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1848.0 570.0)">17</text><line x1="1300" y1="400" x2="1242" y2="400" stroke="#0a66c2" stroke-width="1.5"/><line x1="1300" y1="440.0" x2="1242" y2="440.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1250" y1="400" x2="1250" y2="440.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1250,400 1244,412 1256,412" fill="#0a66c2" stroke="none"/><polygon points="1250,440.0 1244,428.0 1256,428.0" fill="#0a66c2" stroke="none"/><text x="1238" y="420.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 1238 420.0)">2</text><line x1="1440.0" y1="700.0" x2="1440.0" y2="818.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1640.0" y1="700.0" x2="1640.0" y2="818.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1440.0" y1="810.0" x2="1640.0" y2="810.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1440.0,810.0 1452.0,804.0 1452.0,816.0" fill="#0a66c2" stroke="none"/><polygon points="1640.0,810.0 1628.0,804.0 1628.0,816.0" fill="#0a66c2" stroke="none"/><text x="1540.0" y="800.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">Ø 10</text><line x1="1380.0" y1="740.0" x2="1380.0" y2="898.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1700.0" y1="740.0" x2="1700.0" y2="898.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="1380.0" y1="890.0" x2="1700.0" y2="890.0" stroke="#0a66c2" stroke-width="2"/><polygon points="1380.0,890.0 1392.0,884.0 1392.0,896.0" fill="#0a66c2" stroke="none"/><polygon points="1700.0,890.0 1688.0,884.0 1688.0,896.0" fill="#0a66c2" stroke="none"/><text x="1540.0" y="880.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">Ø 16</text><text x="1540.0" y="580.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="middle">creux Ø 6</text><text x="1150" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">Principe :</text><text x="1150" y="1192" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• la collerette est serrée entre le bras et le moteur par ses vis</text><text x="1150" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">  (16 vis M2 × 10 au total, plus longues que celles d'origine) ;</text><text x="1150" y="1276" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• 17 mm : 2 mm de plus que le servo couché sous le châssis,</text><text x="1150" y="1318" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">  le drone se pose sur ses pieds et pas sur le servo ;</text><text x="1150" y="1360" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• tube creux Ø 6 pour alléger la pièce ;</text><text x="1150" y="1402" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• TPU (souple) pour amortir l'atterrissage.</text><text x="200" y="1780" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Cotes en mm, PROVISOIRES : à vérifier au pied à coulisse sur le châssis avant impression.</text><text x="200" y="1818" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Impression PLA, couche 0,2 mm, remplissage 20 % (pieds en TPU). Jeu d'ajustement : 0,2 mm par côté.</text></svg>