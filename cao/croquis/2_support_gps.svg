" stroke="none"/><polygon points="656.0,618.0 650.0,606.0 662.0,606.0" fill="#0a66c2" stroke="none"/><text x="644.0" y="474.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 644.0 474.0)">32</text><text x="200" y="838.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">2 passages de collier 4,5 × 2 dans la base · flèche AVANT gravée (0,6 mm)</text><text x="200" y="878.0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">encoche de 8 mm côté avant pour le connecteur du BN-880</text><text x="200" y="990" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#000" text-anchor="start">VUE DE CÔTÉ (avant à gauche)</text><rect x="146.0" y="1365.0" width="270.0" height="13.5" rx="0" fill="#ddd" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/><text x="434.0" y="1383.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#555" text-anchor="start">plaque du haut du châssis (bord arrière)</text><rect x="200" y="1338.0" width="108.0" height="27.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="281.0" y="1203.0" width="27.0" height="135.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="281.0" y="1185.0" width="315.0" height="18.0" rx="0" fill="#e8eef8" stroke="#000" stroke-width="3"/><rect x="308.0" y="1158.0" width="13.5" height="27.0" rx="0" fill="#dde6f3" stroke="#000" stroke-width="2"/><rect x="582.5" y="1158.0" width="13.5" height="27.0" rx="0" fill="#dde6f3" stroke="#000" stroke-width="2"/><rect x="321.5" y="1068.0" width="261.0" height="90.0" rx="0" fill="#eee" stroke="#000" stroke-width="2" stroke-dasharray="8 6"/><text x="452.0" y="1122.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="normal" fill="#000" text-anchor="middle">GPS</text><line x1="596.0" y1="1185.0" x2="674.0" y2="1185.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="596.0" y1="1338.0" x2="674.0" y2="1338.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="666.0" y1="1185.0" x2="666.0" y2="1338.0" stroke="#0a66c2" stroke-width="2"/><polygon points="666.0,1185.0 660.0,1197.0 672.0,1197.0" fill="#0a66c2" stroke="none"/><polygon points="666.0,1338.0 660.0,1326.0 672.0,1326.0" fill="#0a66c2" stroke="none"/><text x="654.0" y="1261.5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 654.0 1261.5)">17</text><line x1="596.0" y1="1158.0" x2="754.0" y2="1158.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="596.0" y1="1185.0" x2="754.0" y2="1185.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="746.0" y1="1158.0" x2="746.0" y2="1185.0" stroke="#0a66c2" stroke-width="2"/><polygon points="746.0,1158.0 740.0,1170.0 752.0,1170.0" fill="#0a66c2" stroke="none"/><polygon points="746.0,1185.0 740.0,1173.0 752.0,1173.0" fill="#0a66c2" stroke="none"/><text x="734.0" y="1171.5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle" transform="rotate(-90 734.0 1171.5)">3</text><line x1="200" y1="1378.5" x2="200" y2="1463.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="308.0" y1="1378.5" x2="308.0" y2="1463.0" stroke="#0a66c2" stroke-width="1.5"/><line x1="200" y1="1455.0" x2="308.0" y2="1455.0" stroke="#0a66c2" stroke-width="2"/><polygon points="200,1455.0 212,1449.0 212,1461.0" fill="#0a66c2" stroke="none"/><polygon points="308.0,1455.0 296.0,1449.0 296.0,1461.0" fill="#0a66c2" stroke="none"/><text x="254.0" y="1445.0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#0a66c2" text-anchor="middle">12</text><text x="328.0" y="1284.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#000" text-anchor="start">montant ép. 3</text><text x="1450" y="330" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">Principe :</text><text x="1450" y="372" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• base tenue par 2 colliers sur le bord arrière de la plaque du haut ;</text><text x="1450" y="414" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• plateau en porte-à-faux vers l'arrière : le GPS et sa boussole</text><text x="1450" y="456" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">  QMC5883L s'éloignent de l'ESC, des fils de puissance et de la LiPo ;</text><text x="1450" y="498" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• rebord de 1,5 × 3 mm autour du module, tenu par adhésif mousse ;</text><text x="1450" y="540" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• la flèche AVANT gravée sert à orienter la boussole comme le drone.</text><text x="1450" y="582" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start"></text><text x="1450" y="624" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">À vérifier :</text><text x="1450" y="666" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• hauteur totale du drone ≤ 100 mm avec le GPS (17 + 10 mm</text><text x="1450" y="708" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">  au-dessus de la plaque) ;</text><text x="1450" y="750" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• le plateau ne doit pas toucher les hélices arrière (3,5") ;</text><text x="1450" y="792" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="normal" fill="#000" text-anchor="start">• masse estimée ≈ 9 g.</text><text x="200" y="1780" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Cotes en mm, PROVISOIRES : à vérifier au pied à coulisse sur le châssis avant impression.</text><text x="200" y="1818" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#000" text-anchor="start">Impression PLA, couche 0,2 mm, remplissage 20 % (pieds en TPU). Jeu d'ajustement : 0,2 mm par côté.</text></svg>